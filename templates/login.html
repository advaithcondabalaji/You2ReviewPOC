{% extends 'base.html' %}

{% block title %}Log In | You2Review{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white mb-2">Welcome Back</h1>
            <p class="text-slate-400 text-sm">Log in to continue reviewing.</p>
        </div>

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-300 mb-2">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-slate-500"></i>
                    </div>
                    <input type="text" id="username" name="username" required 
                        class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-colors"
                        placeholder="Enter your username">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-300 mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-500"></i>
                    </div>
                    <input type="password" id="password" name="password" required 
                        class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-colors"
                        placeholder="Enter your password">
                </div>
            </div>

            <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-sky-500/20 transition-all">
                Log In
            </button>
        </form>

        <p class="mt-6 text-center text-slate-400 text-sm">
            Don't have an account? 
            <a href="/signup" class="text-sky-400 hover:text-sky-300 font-semibold transition-colors">Sign up here</a>
        </p>
    </div>
</div>
{% endblock %}
